<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>My Web Development Project</h1>

        <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="grid-container">

        <section id="home" class="card">
            <h2>Welcome</h2>
            <p>
                Welcome to my responsive web development project.
            </p>
        </section>

        <section id="about" class="card">
            <h2>About</h2>
            <p>
                This page uses Flexbox for navigation and CSS Grid
                for the main content layout.
            </p>
        </section>

        <section id="contact" class="card contact-card">
            <h2>Contact Me</h2>

            <form id="contactForm">

                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message">Message:</label>
                <textarea id="message" placeholder="Enter your message"></textarea>

                <button type="submit">Submit</button>

                <p id="formMessage"></p>

            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 Anu | ApexPlanet Web Development</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
